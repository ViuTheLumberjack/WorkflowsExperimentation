services:
  jaeger:
    container_name: jaeger
    image: jaegertracing/jaeger:2.5.0
    ports:
    - 5775:5775/udp
    - 6831:6831/udp
    - 6832:6832/udp
    - 5778:5778
    - 16686:16686
    - 5779:5779
    - 14268:14268
    - 14250:14250
    - 14267:14267
    - 4317:4317
    - 4318:4318
  service_0:
    container_name: service_0
    cpuset: 0,1,2,3
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 1024M
    environment:
      JAVA_TOOl_OPTIONS: -javaagent:/usr/local/opentelemetry-javaagent.jar
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_SERVICE_NAME: '{CONTAINER_NAME}'
    image: jboss/wildfly:latest
    ports:
    - 8080:8080
    volumes:
    - ../../../target/ROOT.war:/opt/jboss/wildfly/standalone/deployments/ROOT.war
    - ../../../opentelemetry-javaagent.jar:/usr/local/opentelemetry-javaagent.jar
